name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '26'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Install Android build packages
        run: |
          "${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37" "build-tools;36.0.0" "platform-tools"
      - name: Build, unit tests, lint, and unsigned release
        run: bash ./gradlew --no-daemon -PreleaseSigning=disabled :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
      - name: Compile isolated QA and instrumentation APKs
        run: bash ./gradlew --no-daemon -PreleaseSigning=disabled -Pqa :app:assembleQa :app:assembleQaAndroidTest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: check-reports
          path: app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
